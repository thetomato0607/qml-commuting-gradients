# AI-assisted (Claude, 1987c21): written with Claude.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qml-commuting-gradients"
version = "0.1.0"
description = "Backpropagation-scaling gradients for parameterised quantum circuits via commuting generators"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pennylane==0.44.0",
    "gast>=0.7",  # not declared by pennylane's own metadata, but required at import time
    "numpy>=2.3,<3",
    "scikit-learn>=1.8,<2",
    "matplotlib>=3.10,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]
